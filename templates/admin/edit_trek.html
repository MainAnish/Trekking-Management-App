{% extends "base_dashboard.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block breadcrumb %}
Manage Treks > Edit Trek
{% endblock %}

{% block page_title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-warning text-dark">

        <h4 class="mb-0">
            <i class="bi bi-pencil-square"></i>
            Edit Trek
        </h4>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <!-- Trek Name -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">Trek Name</label>

                    <input
                        type="text"
                        name="trek_name"
                        class="form-control"
                        value="{{ trek.trek_name }}"
                        required>

                </div>

                <!-- Location -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">Location</label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        value="{{ trek.location }}"
                        required>

                </div>

            </div>

            <div class="row">

                <!-- Difficulty -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">Difficulty</label>

                    <select
                        name="difficulty"
                        class="form-select"
                        required>

                        <option value="Easy"
                        {% if trek.difficulty=="Easy" %}selected{% endif %}>
                            Easy
                        </option>

                        <option value="Moderate"
                        {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                            Moderate
                        </option>

                        <option value="Difficult"
                        {% if trek.difficulty=="Difficult" %}selected{% endif %}>
                            Difficult
                        </option>

                    </select>

                </div>

                <!-- Duration -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">Duration (Days)</label>

                    <input
                        type="number"
                        name="duration"
                        class="form-control"
                        value="{{ trek.duration }}"
                        min="1"
                        required>

                </div>

                <!-- Available Slots -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">Available Slots</label>

                    <input
                        type="number"
                        name="available_slots"
                        class="form-control"
                        value="{{ trek.available_slots }}"
                        min="1"
                        required>

                </div>

            </div>

            <!-- Description -->

            <div class="mb-3">

                <label class="form-label">Description</label>

                <textarea
                    name="description"
                    rows="5"
                    class="form-control"
                    required>{{ trek.description }}</textarea>

            </div>

            <div class="row">

                <!-- Start Date -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">Start Date</label>

                    <input
                        type="date"
                        name="start_date"
                        class="form-control"
                        value="{{ trek.start_date }}"
                        required>

                </div>

                <!-- End Date -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">End Date</label>

                    <input
                        type="date"
                        name="end_date"
                        class="form-control"
                        value="{{ trek.end_date }}"
                        required>

                </div>

                <!-- Status -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">Status</label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Pending"
                        {% if trek.status=="Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Open"
                        {% if trek.status=="Open" %}selected{% endif %}>
                            Open
                        </option>

                        <option value="Closed"
                        {% if trek.status=="Closed" %}selected{% endif %}>
                            Closed
                        </option>

                    </select>

                </div>

            </div>

            <!-- Assign Staff -->

            <div class="mb-4">

                <label class="form-label">Assign Staff</label>

                <select
                    name="staff_id"
                    class="form-select">

                    <option value="">Select Staff</option>

                    {% for staff in staff_members %}

                    <option
                        value="{{ staff.id }}"
                        {% if trek.staff_id==staff.id %}selected{% endif %}>

                        {{ staff.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="d-flex justify-content-between">

                <a href="{{ url_for('admin.manage_treks') }}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Back

                </a>

                <button
                    type="submit"
                    class="btn btn-warning">

                    <i class="bi bi-save"></i>

                    Update Trek

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
