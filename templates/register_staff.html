{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <div class="form-header">

        <h2>Staff Registration</h2>

        <p>Apply as Trek Staff</p>

    </div>

    <form method="POST">

        <div class="input-container">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

        </div>

        <div class="button">

            <button class="submit" type="submit">
                REGISTER
            </button>

        </div>

    </form>

    <div class="signup">

        Already have an account?

        <a href="{{ url_for('auth.login') }}">
            Login
        </a>

    </div>

    <div class="signup" style="margin-top:10px;color:white;">

        <small>
            Your account will remain <b>Pending</b> until approved by the Admin.
        </small>

    </div>

</div>

{% endblock %}
